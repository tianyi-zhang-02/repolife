# The site (site/ plus docs/guide/, built by tools/build_site.py with nothing installed) to GitHub Pages, on every
# push to main that touches it. One-time setup in the repository: Settings → Pages → Build and deployment → Source:
# GitHub Actions. Until then the deploy job fails and nothing else is affected.
name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/guide/**
      - README.md
      - tools/build_site.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python tools/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
