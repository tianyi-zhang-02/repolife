# The site (site/ plus docs/guide/, built by tools/build_site.py with nothing installed) to GitHub Pages, on every
# push to main: the demo pages are Tessri on this repository (the HTML report, and the brief of the latest change),
# so every merge rebuilds them. One-time setup in the repository: Settings → Pages → Build and deployment → Source:
# GitHub Actions. Until then the build job fails at its configure-pages step and nothing else is affected.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the demo reads the history: ownership, activity, and the latest change against its base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python tools/build_site.py --out _site --demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
