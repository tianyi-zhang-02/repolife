[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessri"
version = "0.2.0"
description = "Keep code understandable. How a codebase fits together, what a change can reach, who can review it and what nobody maintains, with the evidence for every claim. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tianyi Zhang" }]
keywords = ["maintainability", "code-review", "dependency-graph", "dead-code", "code-ownership", "coding-agents", "claude-code", "codex", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tianyi-zhang-02/tessri"
Issues = "https://github.com/tianyi-zhang-02/tessri/issues"

[project.scripts]
tessri = "tessri.cli:main"

[tool.setuptools.packages.find]
include = ["tessri*"]
