[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolife"
version = "0.1.0"
description = "Which parts of a repository are alive? Volume, git activity and reachability in one report, built for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tianyi Zhang" }]
keywords = ["dead-code", "maintainability", "code-health", "ai-agents", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tianyi-zhang-02/repolife"
Issues = "https://github.com/tianyi-zhang-02/repolife/issues"

[project.scripts]
repolife = "repolife.cli:main"

[tool.setuptools.packages.find]
include = ["repolife*"]
